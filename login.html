<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academy | Admin Sign In</title>
  <meta name="description" content="Sign in to Academy Administration Portal">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="admin-style.css?v=2.0">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <!-- Brand Header -->
      <div class="login-brand">
        <div class="brand-logo-large">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>Academy</h2>
        <p class="login-subtitle">by <strong>PixelSetu</strong></p>
      </div>

      <!-- Alert Box -->
      <div class="login-alert" id="loginAlert" style="display: none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="loginAlertText">Authentication message</span>
      </div>

      <!-- Google Sign In Section (Single Dedicated Option) -->
      <div class="login-actions" style="margin: 1.75rem 0 1rem 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 54px;">
        <div class="google-btn-wrapper" id="googleBtnWrapper" style="width: 100%; display: flex; justify-content: center;">
          <div id="googleSignInBtn"></div>
        </div>
      </div>

      <!-- Footer Security Notice & Public Portal Link -->
      <div class="login-footer" style="margin-top: 1.5rem;">
        <div class="security-tag">
          <i class="fa-solid fa-lock"></i>
          <span>Authorized Access Only</span>
        </div>
        <div style="margin-top: 0.85rem; text-align: center;">
          <a href="index.html" style="color: #94a3b8; font-size: 0.8125rem; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem; transition: color 0.15s ease;">
            <i class="fa-solid fa-arrow-left"></i> Back to Public Website
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Logic Script -->
  <script>
    const GOOGLE_CLIENT_ID = '330236506368-38k618t0l8ick1rosohr9g3ui1teljhg.apps.googleusercontent.com';
    const SESSION_KEY = 'educore_admin_session';
    const AUTHORIZED_ADMIN_EMAILS = [
      'poulami.13thmay@gmail.com'
    ];

    // Check if already logged in -> redirect to admin dashboard
    const existingSession = localStorage.getItem(SESSION_KEY);
    if (existingSession) {
      try {
        const session = JSON.parse(existingSession);
        const userEmail = (session?.email || '').toLowerCase().trim();
        if (session && session.provider === 'google' && AUTHORIZED_ADMIN_EMAILS.includes(userEmail)) {
          window.location.href = 'admin.html';
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch (e) {
        localStorage.removeItem(SESSION_KEY);
      }
    }

    // Google Sign-In Initialization
    function initGoogleAuth() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredentialResponse,
          auto_select: false
        });

        window.google.accounts.id.renderButton(
          document.getElementById('googleSignInBtn'),
          {
            theme: 'outline',
            size: 'large',
            type: 'standard',
            shape: 'rectangular',
            text: 'signin_with',
            logo_alignment: 'left',
            width: 300
          }
        );
      }
    }

    // Handle Google Login Callback
    function handleGoogleCredentialResponse(response) {
      if (!response.credential) {
        showLoginAlert('Google Sign-In failed. Please try again.', 'error');
        return;
      }

      try {
        // Decode JWT payload (base64)
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));

        const payload = JSON.parse(jsonPayload);
        const userEmail = (payload.email || '').toLowerCase().trim();

        // Strictly verify authorized admin email
        const isAuthorized = AUTHORIZED_ADMIN_EMAILS.some(email => email.toLowerCase().trim() === userEmail);

        if (!isAuthorized) {
          showLoginAlert(`Access Denied: (${userEmail}) is not authorized. Only poulami.13thmay@gmail.com has administrative access.`, 'error');
          return;
        }

        const session = {
          name: payload.name || 'Poulami',
          email: userEmail,
          avatar: payload.picture || '',
          provider: 'google',
          loggedInAt: Date.now()
        };

        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        showLoginAlert(`Welcome back, ${session.name}! Redirecting to Admin Dashboard...`, 'success');
        
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 800);
      } catch (err) {
        showLoginAlert('Failed to parse Google credentials.', 'error');
      }
    }

    function showLoginAlert(message, type = 'error') {
      const alertBox = document.getElementById('loginAlert');
      const alertText = document.getElementById('loginAlertText');
      if (alertBox && alertText) {
        alertText.textContent = message;
        alertBox.className = `login-alert ${type}`;
        alertBox.style.display = 'flex';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.google) {
        initGoogleAuth();
      } else {
        window.addEventListener('load', initGoogleAuth);
      }
    });
  </script>
</body>
</html>
